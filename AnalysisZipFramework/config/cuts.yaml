# ─────────────────────────────────────────────────────────────────────────────
# nuAnalysis selection config: cuts and histograms
#
# Histograms:            histograms booked on all events, before the first cut
#   - <histogram>
#
# Cuts:                  applied in the order of this file
#   <cut name>:          name in the cutflow; the eventID_pass flag is 'passed_<cut name>'
#     expression:        RDataFrame filter expression (required)
#     data_type:         ALL (default), DATA, MC or an MC category type (optional, see below)
#     requires:          [conditions] (optional, see below)
#     histograms:        [<histogram>, ...] booked after this cut (optional)
#     n_minus_1:         [<histogram>, ...] N-1 histograms (optional, see below)
#
# <histogram>:
#   name:       unique name of the histogram in the output file (required)
#   title:      optional, defaults to the name
#   data_type:  ALL (default), DATA, MC or an MC category type (optional)
#   requires:   [conditions] (optional)
#   split:      true (default) / false: on MC, also book one copy per MC category (categories.yaml)
#   x:          {variable: <column>, bins: <n>, min: <low>, max: <high>}   fixed binning
#           or  {variable: <column>, edges: [e0, e1, ..., eN]}            variable binning
#   y:          same as x; if present the histogram is 2D (y vs x)
#
# data_type (for cuts and histograms):
#   ALL     every sample
#   DATA    data only
#   MC      MC only
# MC category types (only with MC categories in config/categories.yaml; event level, never on data):
#   signal, background   events of the signal / background categories (background includes 'other')
#   The MC truth selection (e.g. CC nu_mu in the fiducial volume) is done with the categories, not with cuts.
#   other                events in no category
#   <category name>      events of that category, e.g. NC_nu
#   On a cut: the cut only applies to events of those categories, all other events pass it.
#   On a histogram: filled only with events of those categories (and split into them).
#
# requires (for cuts and histograms): skipped (with an INFO / debug message) unless ALL are met
#   reduced_charge          VetoNu reduced charge available (from aux files or the input NTuple)
#   aux_reduced_charge      reduced charge taken from aux (waveform) files
#   native_reduced_charge   reduced charge taken from branches in the input NTuple
#   no_reduced_charge       reduced charge disabled (--no-reduced-charge)
#
# Histograms attached to a cut are booked at that point of the selection even if the cut
# itself is not applied to the current sample: they only follow their own data_type/requires.
# A histogram whose variable does not exist in the dataframe gives a WARNING and is not booked.
#
# N-1 histograms (n_minus_1): filled with the events that pass every OTHER cut applied to the
# sample (before and after this one), i.e. only this cut is removed. Same options as <histogram>,
# names unique together with all other histograms. Written to histograms/n_minus_1/ in the output.
# Skipped if the cut itself is not applied to the sample. They do not change the cutflow.
# On MC with categories, all histograms (incl. N-1) are also written per category, see
# config/categories.yaml for the output structure. Use split: false for large histograms that
# are not needed per category (each copy costs memory, more with -j).
# Example:
#   Track R at IFT < 95 mm:
#     expression: "LeadTrack_rIFT < 95"
#     n_minus_1:
#       - name: LeadTrack_rIFT_Nminus1
#         x: {variable: LeadTrack_rIFT, bins: 100, min: 0, max: 200}
#
# YAML tips: quote expressions (e.g. "!ExcludedTimes": an unquoted value starting with '!'
# means something else in YAML); cut names can contain spaces and symbols but not ': '.
#
# Select a different config with: ./analysis --cuts-config <path>
# ─────────────────────────────────────────────────────────────────────────────

Histograms: []    # booked before the first cut

Cuts:

  # ── Data quality (data only) ──────────────────────────────────────────────
  Colliding:
    expression: "distanceToCollidingBCID == 0"
    data_type: DATA

  Trigger:
    expression: "(inputBits & 0x8) == 0x8 || (inputBits & 0x10) == 0x10 || (inputBits & 0x20) == 0x20 || (inputBits & 0x40) == 0x40"
    data_type: DATA

  Good times:
    expression: "GoodTimes"
    data_type: DATA

  Excluded times:
    expression: "!ExcludedTimes"
    data_type: DATA
    histograms:
      - name: crossingAngle
        title: Crossing angle
        x: {variable: crossingAngle, bins: 400, min: -200, max: 200}

  # Crossing angle selections (not used at the moment):
  # Crossing angle = 150 in 2024 period:
  #   expression: "(!is2024Period) || (crossingAngle == 150.0)"
  # Crossing angle > 150 in 2024 period:
  #   expression: "(!is2024Period) || (crossingAngle > 150.0)"

  # ── MC (the truth selection is done with the MC categories, config/categories.yaml) ──
  Remove CaloNu PMT region (truth):
    expression: "(!isCaloNuPeriod) || (isCaloNuPeriod && !inCaloNuPMT)"
    data_type: MC    # always applied to MC (material mismodelling)
    # Truth-level histograms: the MC truth selection (CC nu_mu, fiducial volume, truth pz) is done with
    # the MC categories (config/categories.yaml), so these are also written per category.
    histograms:
      - name: truth_dec_z_nu_vs_longTracks
        title: Truth decay z vs NlongTracks
        data_type: MC
        x: {variable: truth_dec_z_nu, bins: 200, min: -4000, max: -1500}
        y: {variable: longTracks, bins: 5, min: 0, max: 5}
      - name: truth_dec_x_nu
        title: Truth decay x
        data_type: MC
        x: {variable: truth_dec_x_nu, bins: 200, min: -300, max: 300}
      - name: truth_dec_y_nu
        title: Truth decay y
        data_type: MC
        x: {variable: truth_dec_y_nu, bins: 200, min: -300, max: 300}
      - name: truth_dec_z_nu
        title: Truth decay z
        data_type: MC
        x: {variable: truth_dec_z_nu, bins: 200, min: -3000, max: -1500}
      - name: truth_dec_z_nu_ext
        title: Truth decay z
        data_type: MC
        x: {variable: truth_dec_z_nu, bins: 500, min: -4000, max: 4000}
      - name: truth_dec_x_nu_vs_truth_dec_y_nu
        title: Truth decay x vs Truth decay y
        data_type: MC
        x: {variable: truth_dec_x_nu, bins: 200, min: -300, max: 300}
        y: {variable: truth_dec_y_nu, bins: 200, min: -300, max: 300}
      - name: truth_dec_z_nu_vs_truth_dec_x_nu
        title: Truth decay z vs Truth decay x
        data_type: MC
        x: {variable: truth_dec_z_nu, bins: 500, min: -4000, max: 4000}
        y: {variable: truth_dec_x_nu, bins: 200, min: -300, max: 300}
      - name: truth_dec_z_nu_vs_truth_dec_y_nu
        title: Truth decay z vs Truth decay y
        data_type: MC
        x: {variable: truth_dec_z_nu, bins: 500, min: -4000, max: 4000}
        y: {variable: truth_dec_y_nu, bins: 200, min: -300, max: 300}
      - name: truth_dec_r
        title: Truth decay r
        data_type: MC
        x: {variable: truth_dec_r, bins: 200, min: 0, max: 300}
      - name: truth_pz_nu
        title: Truth pz
        data_type: MC
        x: {variable: truth_pz_nu, bins: 200, min: 0, max: 10000}
      - name: longTracks
        title: NlongTracks
        x: {variable: longTracks, bins: 5, min: 0, max: 5}
      - name: nClusters0_preLongTracks
        title: nClusters0
        x: {variable: nClusters0, bins: 100, min: 0, max: 1000}
      - name: nClusters1_preLongTracks
        title: nClusters1
        x: {variable: nClusters1, bins: 100, min: 0, max: 400}
      - name: nClusters2_preLongTracks
        title: nClusters2
        x: {variable: nClusters2, bins: 100, min: 0, max: 300}
      - name: nClusters3_preLongTracks
        title: nClusters3
        x: {variable: nClusters3, bins: 100, min: 0, max: 200}
      - name: SpacePoints_preLongTracks
        title: SpacePoints
        x: {variable: SpacePoints, bins: 100, min: 0, max: 1000}
      - name: TrackSegments_preLongTracks
        title: TrackSegments
        x: {variable: TrackSegments, bins: 50, min: 0, max: 50}

  # ── Reconstruction selection ──────────────────────────────────────────────
  At least one long track:
    expression: "longTracks > 0"
    histograms:
      - name: nClusters0
        title: nClusters0
        x: {variable: nClusters0, bins: 100, min: 0, max: 1000}
      - name: nClusters1
        title: nClusters1
        x: {variable: nClusters1, bins: 100, min: 0, max: 400}
      - name: nClusters2
        title: nClusters2
        x: {variable: nClusters2, bins: 100, min: 0, max: 300}
      - name: nClusters3
        title: nClusters3
        x: {variable: nClusters3, bins: 100, min: 0, max: 200}
      - name: SpacePoints
        title: SpacePoints
        x: {variable: SpacePoints, bins: 100, min: 0, max: 1000}
      - name: TrackSegments
        title: TrackSegments
        x: {variable: TrackSegments, bins: 50, min: 0, max: 50}

  CaloNu status cleaning:
    expression: "caloNuStatusCleaning"
    data_type: DATA

  Veto20 and Veto21 charge > 40 pC:
    expression: "Veto20_charge > 40 && Veto21_charge > 40"
    histograms:
      - name: Lead_Track_Y_atTrig_vs_Timing_charge_top
        title: Lead track Y at trigger vs Timing charge top
        x: {variable: Lead_Track_Y_atTrig, bins: 200, min: -300, max: 300}
        y: {variable: Timing_charge_top, bins: 200, min: 0, max: 2000}
      - name: Lead_Track_Y_atTrig_vs_Timing_charge_bottom
        title: Lead track Y at trigger vs Timing charge bottom
        x: {variable: Lead_Track_Y_atTrig, bins: 200, min: -300, max: 300}
        y: {variable: Timing_charge_bottom, bins: 200, min: 0, max: 2000}
      - name: Lead_Track_Y_atTrig_vs_Timing_charge_total
        title: Lead track Y at trigger vs Timing charge total
        x: {variable: Lead_Track_Y_atTrig, bins: 200, min: -300, max: 300}
        y: {variable: Timing_charge_total, bins: 200, min: 0, max: 2000}

  Timing Station Charge > 20 pC:
    expression: "hitsTiming"    # timing station hit consistent with the lead track y (see BuildDataFrame)

  Preshower Charge > 2.5 pC:
    expression: "Preshower0_charge > 2.5 && Preshower1_charge > 2.5"

  Track pz > 100 GeV:
    expression: "LeadTrack_pz0 > 100"

  Leading track has at >= 7 layers:
    expression: "LeadTrack_nLayers >= 7"

  Track nDoF >= 9:
    expression: "LeadTrack_nDoF >= 9"

  Leading track has chi2/ndof < 15:
    expression: "LeadTrack_Chi2_NDF < 15"

  Track R at max radius < 95 mm:
    expression: "LeadTrack_r_atMaxRadius < 95"

  Track R at IFT < 95 mm:
    expression: "LeadTrack_rIFT < 95"

  Track rVetoNu < 120 mm:
    expression: "LeadTrack_rVetoNu < 120"

  Leading track theta < 25 mrad:
    expression: "LeadTrack_Theta < 25"

  # ── VetoNu veto ───────────────────────────────────────────────────────────
  # With the reduced charge: reduced charge < 30 pC (+ raw-charge fallback when the aux value
  # is not valid). With --no-reduced-charge: raw charge < 40 pC.
  Sanity cut to remove events with missing aux data:
    expression: "AuxLookupSuccess"
    requires: [aux_reduced_charge]
    histograms:
      - name: VetoNu0_reduced_charge
        title: VetoNu0 reduced charge
        requires: [reduced_charge]
        x: {variable: VetoNu0_reduced_charge, bins: 2501, min: -1, max: 2500}
      - name: VetoNu1_reduced_charge
        title: VetoNu1 reduced charge
        requires: [reduced_charge]
        x: {variable: VetoNu1_reduced_charge, bins: 2501, min: -1, max: 2500}
      - name: VetoNu0_reduced_charge_vs_VetoNu1_reduced_charge
        title: VetoNu0 reduced charge vs VetoNu1 reduced charge
        requires: [reduced_charge]
        x: {variable: VetoNu0_reduced_charge, bins: 2501, min: -1, max: 2500}
        y: {variable: VetoNu1_reduced_charge, bins: 2501, min: -1, max: 2500}
      - name: truth_dec_z_nu_vs_VetoNu0_reduced_charge
        title: Truth decay z vs VetoNu0 reduced charge
        data_type: MC
        requires: [reduced_charge]
        x: {variable: truth_dec_z_nu, bins: 500, min: -4000, max: -1500}
        y: {variable: VetoNu0_reduced_charge, bins: 2501, min: -1, max: 2500}
      - name: truth_dec_z_nu_vs_VetoNu1_reduced_charge
        title: Truth decay z vs VetoNu1 reduced charge
        data_type: MC
        requires: [reduced_charge]
        x: {variable: truth_dec_z_nu, bins: 500, min: -4000, max: -1500}
        y: {variable: VetoNu1_reduced_charge, bins: 2501, min: -1, max: 2500}
      - name: VetoNu0_raw_charge
        title: VetoNu0 raw charge
        requires: [no_reduced_charge]
        x: {variable: VetoNu0_raw_charge, bins: 2501, min: -1, max: 2500}
      - name: VetoNu1_raw_charge
        title: VetoNu1 raw charge
        requires: [no_reduced_charge]
        x: {variable: VetoNu1_raw_charge, bins: 2501, min: -1, max: 2500}

  VetoNu0 reduced charge < 30 pC:
    expression: "VetoNu0_reduced_charge < 30"
    requires: [reduced_charge]

  VetoNu1 reduced charge < 30 pC:
    expression: "VetoNu1_reduced_charge < 30"
    requires: [reduced_charge]

  VetoNu0 raw charge < 40 pC (fallback to raw charge if reduced charge invalid):
    expression: "fallbackVetoNu0Charge < 40"
    requires: [aux_reduced_charge]

  VetoNu1 raw charge < 40 pC (fallback to raw charge if reduced charge invalid):
    expression: "fallbackVetoNu1Charge < 40"
    requires: [aux_reduced_charge]

  VetoNu0 raw charge < 40 pC:
    expression: "VetoNu0_raw_charge < 40"
    requires: [no_reduced_charge]

  VetoNu1 raw charge < 40 pC:
    expression: "VetoNu1_raw_charge < 40"
    requires: [no_reduced_charge]
