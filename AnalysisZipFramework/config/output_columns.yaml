# ─────────────────────────────────────────────────────────────────────────────
# nuAnalysis output columns config: which columns are written to the output 'nt' tree
#
# nt:
#   save_all_input_columns:   true/false  every branch of the input NTuple (incl. aliases)
#   save_all_defined_columns: true/false  every column created at runtime with Define/Redefine
#                                         (e.g. LeadTrack_*, reduced charge, GoodTimes, ...)
#   keep:       columns to save for all samples
#   keep_mc:    columns to save for MC only (e.g. truth), not checked for data
#   keep_data:  columns to save for data only, not checked for MC
#   drop:       columns removed from the selection (applied last)
#
# Entries are exact column names or glob patterns: '*' (anything), '?' (one character),
# '[...]' (character set), e.g. "LeadTrack_*". Quote entries that start with '*', e.g.
# "*_charge", because an unquoted '*' at the start of a YAML value means something else.
#
# A WARNING is printed for every entry that does not match any column in the dataframe.
# 'run' and 'eventID' are always saved (needed to match nt events to eventID_pass).
#
# Select a different output config with: ./analysis --output-config <path>
# ─────────────────────────────────────────────────────────────────────────────
#
# This default lists every column explicitly (generated from the 2024 data run 16000 and
# MC 200139 NTuples, r0022 / s0015, plus the columns the framework defines), so the
# output is the same as saving everything. Prune the lists to save only what you need.
#
# Notes:
#  - New columns added to the framework are NOT saved unless added here
#    (or set save_all_defined_columns: true).
#  - The aux-derived columns in keep_data (AuxLookupSuccess, TimingOK, valid*/fallback*,
#    GoodVeto*Hit, ...) only exist when the reduced charge comes from aux files, so they
#    give warnings with --no-reduced-charge or for data NTuples with native reduced charge.

